<div class="bar" id="bar" aria-live="polite">NEXUS 07.1 / OPERATIONAL COMMAND CENTER READY</div>
<main id="main">
 <!-- Dynamic SPA view rendered here -->
</main>
<footer>
 <div class="row">
  <span>NEXUS // 07.1 · LIFE OPERATIONS & COGNITIVE OFFLOADING</span>
  <span class="amber" id="footerClock"></span>
 </div>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const state = {
  route: 'home',
  sessionRole: localStorage.getItem('nexus_role') || 'GUEST',
  tasks: JSON.parse(localStorage.getItem('nexus_tasks') || '[]'),
  incomeLogs: JSON.parse(localStorage.getItem('nexus_income') || '[]'),
  bills: JSON.parse(localStorage.getItem('nexus_bills') || '[]'),
  telemetryLogs: JSON.parse(localStorage.getItem('nexus_telemetry') || '[]'),
  settings: JSON.parse(localStorage.getItem('nexus_settings') || '{"mode":"local","apiKey":""}')
};

const AGENTS_DATA = [
  { id: 'fin', name: 'FINANCE AGENT', role: 'W-2 Payroll & Topstep Payouts', status: 'ACTIVE', desc: 'Monitors net cash flow, debt acceleration on M&T STI loan, and 48-hour liquidity buffers.' },
  { id: 'trade', name: 'TRADING AGENT', role: 'NQ/ES Futures Risk Supervisor', status: 'ACTIVE', desc: 'Tracks $50K Topstep funded account drawdown limits, daily P&L, and contract sizing.' },
  { id: 'content', name: 'CONTENT AGENT', role: 'Wolf SaByter Brand Hub', status: 'STANDBY', desc: 'Automates faceless static image carousels and spiritual daily quote dissemination.' },
  { id: 'ops', name: 'SYSTEMS AGENT', role: 'Workspace & Repo Automation', status: 'ACTIVE', desc: 'Synchronizes local vault records with GitHub and Google Workspace APIs.' }
];

function saveState(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

function logTelemetry(msg) {
  const entry = `[${new Date().toISOString().replace('T',' ').substring(0,19)}] ${msg}`;
  state.telemetryLogs.unshift(entry);
  if(state.telemetryLogs.length > 100) state.telemetryLogs.pop();
  saveState('nexus_telemetry', state.telemetryLogs);
}

// Router
const routes = {
  '': renderHome,
  'home': renderHome,
  'dashboard': renderDashboard,
  'nexus': renderNexus,
  'personas': renderPersonas,
  'tasks': renderTasks,
  'income': renderIncomeView,
  'bills': renderBillsView,
  'telemetry': renderTelemetryView,
  'accounts': renderAccountsView,
  'terminal': renderTerminalView,
  'vault': renderVaultView,
  'access': renderAccessView,
  'settings': renderSettingsView,
  'login': renderLoginView
};

function router() {
  const hash = location.hash.replace('#/', '').replace('#', '') || 'home';
  state.route = hash;
  
  // Highlight nav
  document.querySelectorAll('nav a').forEach(a => {
    const nav = a.getAttribute('data-nav');
    if(nav === hash || (hash === '' && nav === 'dashboard')) {
      a.setAttribute('aria-current', 'page');
    } else {
      a.removeAttribute('aria-current');
    }
  });

  const renderFn = routes[hash] || renderHome;
  const main = document.getElementById('main');
  main.innerHTML = '';
  renderFn(main);
  renderHeader();
}

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', () => {
  renderHeader();
  router();
  setInterval(() => {
    const d = new Date();
    const timeStr = d.toISOString().replace('T',' ').substring(0,19) + ' UTC';
    const c = document.getElementById('clock');
    if(c) c.textContent = timeStr;
    const fc = document.getElementById('footerClock');
    if(fc) fc.textContent = timeStr;
  }, 1000);
});

function renderHeader() {
  const badge = document.getElementById('badge');
  badge.textContent = state.sessionRole;
  badge.className = `tag ${state.sessionRole === 'ADMIN' ? 'red' : state.sessionRole === 'OPERATOR' ? 'amber' : ''}`;
  
  const loginLink = document.getElementById('loginLink');
  const logoutBtn = document.getElementById('logout');
  if(state.sessionRole !== 'GUEST') {
    loginLink.hidden = true;
    logoutBtn.hidden = false;
  } else {
    loginLink.hidden = false;
    logoutBtn.hidden = true;
  }
}

document.getElementById('logout').addEventListener('click', () => {
  setSessionRole('GUEST');
  router();
  showToast('Signed out to Guest mode.');
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  setTimeout(() => { t.textContent = ''; }, 3500);
}

// --- VIEWS ---

function renderHome(container) {
  container.innerHTML = `
    <div class="landing">
      <div>
        <span class="eyebrow">NEXUS // LIFE OPERATIONS</span>
        <h1>OUT OF YOUR HEAD.<br><span class="gradient">INTO YOUR SYSTEM.</span></h1>
        <p>A working command center for hours, paychecks, bills, responsibilities, and each agent’s workspace.</p>
        <div class="buttons">
          <a class="button primary" href="#/dashboard">OPEN OVERVIEW →</a>
          <a class="button" href="#/nexus">MEET NEXUS</a>
          <a class="button" href="#/settings">CONNECT / SETUP</a>
        </div>
      </div>
      <div class="panel">
        <div class="row">
          <span class="eyebrow">IDENTITY SIGNATURE</span>
          <span class="tag">NEXUS / 07.1</span>
        </div>
        <svg class="sigil" viewBox="0 0 128 128" role="img" aria-label="Wolf emblem">
          <rect width="128" height="128" rx="24" fill="#090909"/>
          <path d="M18 40V18h22m48 92h22V88" fill="none" stroke="#c51f30" stroke-width="5"/>
          <path d="M29 33l24 15 11-7 11 7 24-15-7 43-28 27-28-27z" fill="#e8dfc9"/>
          <path d="M42 57l16 9-13 1zm44 0l-16 9 13 1z" fill="#c51f30"/>
          <path d="M54 78h20L64 90z" fill="#090909"/>
        </svg>
        <div class="row">
          <small class="amber">SIGNAL: PRESENT</small>
          <small id="clock"></small>
        </div>
      </div>
    </div>
  `;
}

function renderDashboard(container) {
  const pendingBills = state.bills.filter(b => !b.paid).reduce((s, b) => s + b.amount, 0);
  const lastIncome = state.incomeLogs[0] ? state.incomeLogs[0].net : 2850;
  const netBuffer = lastIncome - pendingBills;

  container.innerHTML = `
    <div class="row">
      <div>
        <span class="eyebrow">COMMAND CENTER</span>
        <h1>OPERATIONAL OVERVIEW</h1>
      </div>
      <div class="buttons">
        <a class="button primary" href="#/income">+ LOG HOURS / PAYCHECK</a>
        <a class="button" href="#/bills">+ ADD BILL</a>
        <a class="button" href="#/tasks">+ NEW TASK</a>
        <a class="button" href="#/terminal">LAUNCH CLI</a>
      </div>
    </div>

    <div class="stats" style="margin-top:24px;">
      <div class="panel">
        <span class="eyebrow">LIQUIDITY BUFFER</span>
        <div class="number" style="color:var(--green)">+$${netBuffer.toFixed(2)}</div>
        <small>48h Safe Net Balance</small>
      </div>
      <div class="panel">
        <span class="eyebrow">TOPSTEP ACCOUNT</span>
        <div class="number">$52,410.00</div>
        <small>Funded $50K Equity</small>
      </div>
      <div class="panel">
        <span class="eyebrow">PENDING BILLS</span>
        <div class="number" style="color:var(--red)">$${pendingBills.toFixed(2)}</div>
        <small>${state.bills.filter(b=>!b.paid).length} Unpaid Obligations</small>
      </div>
      <div class="panel">
        <span class="eyebrow">ACTIVE TASKS</span>
        <div class="number">${state.tasks.filter(t=>!t.completed).length}</div>
        <small>Pending Execution</small>
      </div>
    </div>

    <div class="grid" style="margin-top:24px;">
      <div class="panel card">
        <span class="eyebrow">01 / INCOME & PAYROLL</span>
        <h2>Recent Paychecks</h2>
        <p>${state.incomeLogs.length} payroll records logged. Base rate: $20.00/hr active.</p>
        <a class="button" href="#/income">Manage Income →</a>
      </div>
      <div class="panel card">
        <span class="eyebrow">02 / BILLS & OBLIGATIONS</span>
        <h2>Auto-Draft Pipeline</h2>
        <p>${state.bills.length} total scheduled bills tracked against checking liquidity.</p>
        <a class="button" href="#/bills">Manage Bills →</a>
      </div>
      <div class="panel card">
        <span class="eyebrow">03 / AGENT DOSSIERS</span>
        <h2>Domain Agents</h2>
        <p>4 autonomous agents active across Finance, Trading, Content, and Systems.</p>
        <a class="button" href="#/personas">Inspect Agents →</a>
      </div>
    </div>
  `;
}

function renderNexus(container) {
  container.innerHTML = `
    <span class="eyebrow">NEXUS CORE OPERATING SYSTEM</span>
    <h1>FRAMEWORK INTEGRATION & AUTOMATION HUB</h1>
    <p>“Out of your head. Into your system.” The NEXUS hub consolidates all cognitive load into autonomous background loops.</p>
    
    <div class="grid" style="margin-top:24px;">
      <div class="panel">
        <span class="eyebrow">GMAIL SYNC</span>
        <h2>Connected</h2>
        <p>Parsing auto-draft notifications, digital bill receipts, and payroll alerts. Sync Interval: 15m</p>
      </div>
      <div class="panel">
        <span class="eyebrow">GOOGLE SHEETS</span>
        <h2>Active Sync</h2>
        <p>Amortization schedules for M&T STI auto loan balance tracker sync.</p>
      </div>
      <div class="panel">
        <span class="eyebrow">GEMINI API</span>
        <h2>Ready</h2>
        <p>Autonomous context processing engine for personal domain agents. Latency: 140ms</p>
      </div>
    </div>
  `;
}

function renderPersonas(container) {
  container.innerHTML = `
    <span class="eyebrow">PERSONA REGISTRY</span>
    <h1>DOMAIN AGENT DOSSIERS</h1>
    <p>Specialized autonomous agents governing specific operational sectors.</p>
    
    <div class="grid" style="margin-top:24px;">
      ${AGENTS_DATA.map(a => `
        <div class="panel card">
          <span class="eyebrow">${a.status}</span>
          <h2>${a.name}</h2>
          <p><strong>${a.role}</strong><br>${a.desc}</p>
          <span class="tag">${a.id.toUpperCase()}_DOMAIN</span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTasks(container) {
  container.innerHTML = `
    <div class="row">
      <div>
        <span class="eyebrow">TASK MANAGER</span>
        <h1>RESPONSIBILITIES & EXECUTION</h1>
      </div>
    </div>

    <form onsubmit="handleAddTask(event)" class="panel" style="margin-top:20px;">
      <h2>Add New Task</h2>
      <div class="two">
        <div class="field">
          <label>Task Title</label>
          <input type="text" id="task-title" required placeholder="e.g. Rebalance Webull portfolio">
        </div>
        <div class="field">
          <label>Priority</label>
          <select id="task-priority">
            <option value="HIGH">HIGH (Focus)</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="LOW">LOW</option>
          </select>
        </div>
      </div>
      <button type="submit" class="primary">ADD TASK TO SYSTEM</button>
    </form>

    <div class="panel" style="margin-top:20px;">
      <div class="row">
        <h2>Task Queue</h2>
        <button onclick="clearCompletedTasks()" class="small">CLEAR COMPLETED</button>
      </div>
      <div id="task-list" style="margin-top:15px;">
        ${state.tasks.length === 0 ? '<p class="empty">No tasks currently recorded in system.</p>' : 
          state.tasks.map(t => `
            <div class="item ${t.completed ? 'done' : ''}">
              <div class="row">
                <div class="checkrow">
                  <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTaskState(${t.id})">

              </div>

          `).join('')}
      </div>
    </div>
  `;
}

// --- LOGIC FUNCTIONS ---

function handleAddTask(e) {
  e.preventDefault();
  if(state.sessionRole === 'GUEST') { alert('Guest role cannot add tasks.'); return; }
  const title = document.getElementById('task-title').value.trim();
  const priority = document.getElementById('task-priority').value;
  if(title) {
    state.tasks.push({ id: Date.now(), title, priority, completed: false });
    saveState('nexus_tasks', state.tasks);
    document.getElementById('task-title').value = '';
    renderTasks();
    logTelemetry(`[TASK ADDED] ${title}`);
    showToast('Task added successfully.');
  }
}

function toggleTaskState(id) {
  state.tasks = state.tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
  saveState('nexus_tasks', state.tasks);
  renderTasks();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveState('nexus_tasks', state.tasks);
  renderTasks();
}

function clearCompletedTasks() {
  state.tasks = state.tasks.filter(t => !t.completed);
  saveState('nexus_tasks', state.tasks);
  renderTasks();
}

function calculateIncome() {
  const hours = parseFloat(document.getElementById('income-hours').value) || 0;
  const rate = parseFloat(document.getElementById('income-rate').value) || 20;
  const otHours = parseFloat(document.getElementById('income-ot-hours').value) || 0;
  
  const gross = (hours * rate) + (otHours * rate * 1.5);
  const net = gross * 0.72;
  
  document.getElementById('calc-gross-output').textContent = `$${gross.toFixed(2)}`;
  document.getElementById('calc-net-output').textContent = `$${net.toFixed(2)}`;
}

function handleLogPaycheck(e) {
  e.preventDefault();
  if(state.sessionRole === 'GUEST') { alert('Guest role cannot log income.'); return; }
  
  const hours = parseFloat(document.getElementById('income-hours').value) || 0;
  const rate = parseFloat(document.getElementById('income-rate').value) || 20;
  const otHours = parseFloat(document.getElementById('income-ot-hours').value) || 0;
  const note = document.getElementById('income-note').value.trim() || 'Standard Paycheck';
  
  const gross = (hours * rate) + (otHours * rate * 1.5);
  const net = gross * 0.72;
  
  const newLog = {
    id: Date.now(),
    date: new Date().toISOString().split('T')[0],
    hours: hours + otHours,
    gross: gross,
    net: net,
    note: note
  };
  
  state.incomeLogs.unshift(newLog);
  saveState('nexus_income', state.incomeLogs);
  renderIncomeView(document.getElementById('main'));
  
  // Trigger Glitch Animation Feedback
  const mainPanel = document.getElementById('main');
  mainPanel.classList.add('flash', 'agent-transition');
  setTimeout(() => mainPanel.classList.remove('flash', 'agent-transition'), 400);

  logTelemetry(`[INCOME LOGGED] Net Pay: $${net.toFixed(2)} | Note: ${note}`);
  showToast('Paycheck logged successfully with glitch telemetry flash.');
}

function deleteIncomeLog(id) {
  state.incomeLogs = state.incomeLogs.filter(l => l.id !== id);
  saveState('nexus_income', state.incomeLogs);
  renderIncomeView(document.getElementById('main'));
}

function calculateTopstepAllocation() {
  const payout = parseFloat(document.getElementById('topstep-payout-input').value) || 0;
  document.getElementById('ts-debt-alloc').textContent = `$${(payout * 0.5).toFixed(2)}`;
  document.getElementById('ts-vault-alloc').textContent = `$${(payout * 0.5).toFixed(2)}`;
}

function handleAddBill(e) {
  e.preventDefault();
  if(state.sessionRole === 'GUEST') { alert('Guest role cannot add bills.'); return; }
  const name = document.getElementById('bill-name').value.trim();
  const amount = parseFloat(document.getElementById('bill-amount').value) || 0;
  const dueDate = document.getElementById('bill-duedate').value;
  
  if(name && amount && dueDate) {
    state.bills.push({ id: Date.now(), name, amount, dueDate, paid: false });
    saveState('nexus_bills', state.bills);
    renderBillsView(document.getElementById('main'));
    logTelemetry(`[BILL ADDED] ${name}: $${amount}`);
    showToast('Bill added.');
  }
}

function toggleBillPaid(id) {
  state.bills = state.bills.map(b => b.id === id ? { ...b, paid: !b.paid } : b);
  saveState('nexus_bills', state.bills);
  renderBillsView(document.getElementById('main'));
}

function deleteBill(id) {
  state.bills = state.bills.filter(b => b.id !== id);
  saveState('nexus_bills', state.bills);
  renderBillsView(document.getElementById('main'));
}

function clearTelemetry() {
  state.telemetryLogs = [];
  saveState('nexus_telemetry', state.telemetryLogs);
  renderTelemetryView(document.getElementById('main'));
  showToast('Telemetry cleared.');
}

function handleCliSubmit(e) {
  e.preventDefault();
  const input = document.getElementById('cli-input');
  const cmd = input.value.trim().toLowerCase();
  input.value = '';
  if(!cmd) return;
  
  const output = document.getElementById('terminalOutput');
  output.innerHTML += `<p class="command">&gt; ${cmd}</p>`;
  
  let resp = '';
  switch(cmd) {
    case 'help':
      resp = `Available commands: help, status, tasks, income, payroll, bills, agents, clear, ping, whoami`;
      break;
    case 'status':
      resp = `SYSTEM: OPERATIONAL | VER: 07.1 | NODE: LOCAL VAULT | CLEARANCE: ${state.sessionRole}`;
      break;
    case 'tasks':
      resp = `PENDING TASKS (${state.tasks.filter(t=>!t.completed).length}):\n` + state.tasks.filter(t=>!t.completed).map(t => `- [${t.priority}] ${t.title}`).join('\n');
      break;
    case 'income':
    case 'payroll':
      if(!state.incomeLogs || state.incomeLogs.length === 0) {
        resp = `NO PAYROLL LOGS FOUND IN VAULT.`;
      } else {
        resp = `=== PAYROLL LOG HISTORY (${state.incomeLogs.length} RECORDS) ===\n` +
          state.incomeLogs.map((l, i) => `#${i+1} | Date: ${l.date} | ${l.hours}hrs | Gross: $${l.gross.toFixed(2)} | Net: $${l.net.toFixed(2)} | Note: "${l.note || 'N/A'}"`).join('\n');
      }
      break;
    case 'bills':
      resp = `OUTSTANDING BILLS:\n` + state.bills.filter(b=>!b.paid).map(b => `- ${b.name}: $${b.amount.toFixed(2)} (Due: ${b.dueDate})`).join('\n');
      break;
    case 'agents':
      resp = AGENTS_DATA.map(a => `${a.name}: ${a.status}`).join(' | ');
      break;
    case 'clear':
      output.innerHTML = '';
      return;
    case 'ping':
      resp = `PONG. Latency: 12ms. Core reactive loop normal.`;
      break;
    case 'whoami':
      resp = `USER: wolfX_Xsabyter | ROLE: ${state.sessionRole} | ACC_ID: 0x89F2A`;
      break;
    default:
      resp = `Command not recognized: '${cmd}'. Type 'help' for command directory.`;
  }
  
  output.innerHTML += `<p class="amber" style="white-space:pre-wrap;">${resp}</p>`;
  output.scrollTop = output.scrollHeight;
  logTelemetry(`[CLI EXEC] ${cmd}`);
}

function handleLoginSubmit(e) {
  e.preventDefault();
  setSessionRole('OPERATOR');
  router();
  showToast('Authenticated as OPERATOR.');
}

function setSessionRole(role) {
  state.sessionRole = role;
  localStorage.setItem('nexus_role', role);
  renderHeader();
  logTelemetry(`[AUTH CHANGE] Session clearance updated to: ${role}`);
}

function resetAllData() {
  if(confirm('Are you sure you want to reset all local vault data?')) {
    localStorage.clear();
    location.reload();
  }
}
